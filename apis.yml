description: >-
  OfferFit is an AI decisioning company whose reinforcement-learning platform
  automated marketing experimentation and 1:1 personalization (replacing manual
  A/B testing with self-learning agents). OfferFit was acquired by Braze in 2025
  and its product now ships as the BrazeAI Decisioning Studio. The offerfit.ai
  domain 301-redirects entirely to braze.com, and OfferFit publishes no
  independent developer API, documentation, SDK, or developer portal of its own.
  This profile was surfaced as a Menlo Ventures portfolio company and enriched
  via live DNS/TLS/HTTP domain probes.
